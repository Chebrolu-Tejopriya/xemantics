<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{--ink:#0F172A;--ink2:#64748B;--line:#E2E8F0;--accent:#0052FE;--ok:#0B845D;
        --warn-bg:#FEF3E2;--warn:#B45309;--mono:'SFMono-Regular',Consolas,Menlo,monospace;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
       font-size:12px;line-height:1.5;color:var(--ink);background:#fff;}
  .wrap{padding:14px;}
  h1{font-size:13px;font-weight:600;margin:0 0 3px;}
  .sub{color:var(--ink2);font-size:11px;margin:0 0 14px;}
  button{font:inherit;font-size:13px;font-weight:500;padding:10px 14px;border-radius:7px;
         border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;width:100%;}
  button:hover{background:#0148DF;}
  button:disabled{background:#CBD5E1;border-color:#CBD5E1;cursor:not-allowed;}
  button.sm{font-size:11px;padding:5px 9px;width:auto;background:#fff;color:var(--ink);
            border-color:var(--line);font-weight:500;}
  button.sm:hover{border-color:#94A3B8;background:#F8FAFC;}
  .hint{text-align:center;color:var(--ink2);font-size:11px;margin-top:7px;}
  .out{margin-top:14px;display:none;}
  .out.show{display:block;}
  .big{display:flex;align-items:baseline;gap:6px;margin-bottom:6px;}
  .big b{font-size:22px;font-weight:600;color:var(--ok);}
  .big span{font-size:11px;color:var(--ink2);}
  .row{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;color:var(--ink2);}
  .row b{color:var(--ink);font-weight:600;}
  .sec{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;}
  .sec h2{font-size:12px;font-weight:600;margin:0 0 3px;}
  .sec p{font-size:11px;color:var(--ink2);margin:0 0 10px;}
  .card{border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:8px;transition:border-color .12s,background .12s;}
  .card.done{background:#F0FDF4;border-color:#BBF7D0;}
  .card.selected{background:#EFF5FF;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .ch{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .sw{width:20px;height:20px;border-radius:4px;border:1px solid rgba(0,0,0,.12);flex:0 0 auto;}
  .meta{flex:1;min-width:0;}
  .meta .t{font-family:var(--mono);font-size:10.5px;font-weight:600;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .meta .s{font-size:10px;color:var(--ink2);}
  .ctl{position:relative;display:flex;gap:6px;align-items:center;}
  .picker{flex:1;min-width:0;}
  .picker-btn{width:100%;display:flex;align-items:center;gap:7px;font:inherit;font-size:11px;
              padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:#fff !important;
              color:var(--ink);cursor:pointer;text-align:left;outline:none;}
  .picker-btn:hover{border-color:#94A3B8;background:#fff !important;}
  .picker-btn:active,.picker-btn:focus,.picker-btn:focus-visible,.picker-btn.open{
    background:#fff !important;border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,82,254,.15);}
  .picker-btn .ph{color:var(--ink2);}
  .picker-btn .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .picker-btn .car{color:var(--ink2);font-size:9px;flex:0 0 auto;}
  .picker-btn .tag{flex:0 0 auto;color:var(--accent);background:#EFF5FF;font-size:9px;
                    font-weight:600;padding:1px 6px;border-radius:4px;}
  .menu{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;
        border:1px solid var(--line);border-radius:7px;box-shadow:0 6px 20px rgba(15,23,42,.14);
        z-index:20;max-height:220px;display:flex;flex-direction:column;overflow:hidden;}
  .menu.up{top:auto;bottom:calc(100% + 4px);}
  .menu.hide{display:none;}
  .menu input{font:inherit;font-size:11px;border:none;border-bottom:1px solid var(--line);
              padding:7px 8px;outline:none;}
  .menu .opts{overflow-y:auto;}
  .opt{display:flex;align-items:center;gap:7px;padding:6px 8px;cursor:pointer;background:#fff;}
  .opt:hover{background:#F8FAFC;}
  .opt:active,.opt.active{background:#EFF5FF;}
  .opt .lbl{font-family:var(--mono);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .opt .empty{padding:10px 8px;color:var(--ink2);font-size:11px;}
  .sw.split{background:none;padding:0;overflow:hidden;display:flex;}
  .sw.split i{flex:1;display:block;}
  .err{background:#FEF2F2;color:#B91C1C;border-radius:7px;padding:10px;font-size:11px;
       margin-top:12px;display:none;}
  .err.show{display:block;}
  .foot{margin-top:14px;text-align:center;}
  .foot a{color:var(--ink2);font-size:10px;cursor:pointer;text-decoration:none;}
  .foot a:hover{color:var(--ink);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Xemantics</h1>
  <p class="sub">Converts primitives to semantic tokens.</p>

  <button id="go" disabled>Apply to selection</button>
  <p class="hint" id="hint">Select a frame</p>

  <div id="out" class="out"></div>
  <div id="err" class="err"></div>
  <div class="foot"><a id="clr">Clear saved mappings</a></div>
</div>
<script>
var $ = function(id){ return document.getElementById(id); };
function send(o){ parent.postMessage({ pluginMessage:o }, "*"); }
var TOKENS = [];   // [{name, light, dark}]
var openMenu = null;

$("go").onclick = function(){
  $("go").disabled = true; $("go").textContent = "Applying…";
  send({type:"apply"});
};
$("clr").onclick = function(){ send({type:"clearOverrides"}); };
send({type:"check"});

/**
 * Window "hugs" its actual content instead of sitting at a fixed height
 * with a big blank area below a short empty state — resize on load and
 * again after every render that can change content height (results
 * appearing, an error showing). Clamped in code.js too, but clamp here
 * as well so we never ask for something absurd.
 */
function fitWindow(){
  var h = Math.max(160, Math.min(640, document.body.scrollHeight));
  send({type:"resize", width:380, height:h});
}
window.addEventListener('load', fitWindow);
setTimeout(fitWindow, 0);
// "toggle" doesn't bubble, but a capture-phase listener on document still
// sees it for any <details> (the Diagnostics section) opened/closed later.
document.addEventListener('toggle', fitWindow, true);

function esc(s){ return String(s).replace(/[<>&"]/g, function(c){
  return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]; }); }

/** Two-tone swatch (Light | Dark); falls back to a single tone if only one is known. */
function swatchHtml(light, dark, extraAttrs){
  var l = light || dark || '#E2E8F0';
  var d = dark || light || '#E2E8F0';
  return '<div class="sw split" '+(extraAttrs||'')+' title="Light '+esc(l)+' / Dark '+esc(d)+'">' +
           '<i style="background:'+esc(l)+'"></i><i style="background:'+esc(d)+'"></i>' +
         '</div>';
}

/** Finds a TOKENS entry by name, for pre-filling a suggested swatch. */
function tokenByName(name){
  for(var i=0;i<TOKENS.length;i++){ if(TOKENS[i].name===name) return TOKENS[i]; }
  return null;
}

function renderSection(title, hint, list, kind){
  if(!list.length) return '';
  var h = '<div class="sec"><h2>'+esc(title)+'</h2><p>'+esc(hint)+'</p>';
  list.forEach(function(u, i){
    var id = kind+i;
    var sugg = u.suggested ? tokenByName(u.suggested) : null;
    var btnInner = sugg
      ? swatchHtml(sugg.light, sugg.dark) + '<span class="lbl">'+esc(sugg.name)+'</span>' +
        '<span class="tag">Suggested</span><span class="car">▾</span>'
      : '<span class="ph">Choose a token…</span><span class="car">▾</span>';
    h += '<div class="card" id="card-'+id+'">' +
           '<div class="ch">' +
             swatchHtml(u.hex, u.hex, 'data-i="'+id+'"') +
             '<div class="meta">' +
               '<div class="t">'+esc(u.primitive)+'</div>' +
               '<div class="s">'+esc(u.prop)+' · '+esc(u.type)+' · '+u.count+' layer'+(u.count>1?'s':'')+'</div>' +
             '</div>' +
             '<button class="sm" data-sel="'+id+'">Select</button>' +
           '</div>' +
           '<div class="ctl">' +
             '<div class="picker" data-picker="'+id+'">' +
               '<button type="button" class="picker-btn" data-picker-btn="'+id+'"'+(sugg?' data-value="'+esc(sugg.name)+'"':'')+'>' +
                 btnInner +
               '</button>' +
               '<div class="menu hide" data-menu="'+id+'">' +
                 '<input type="text" placeholder="Search tokens…" data-search="'+id+'">' +
                 '<div class="opts" data-opts="'+id+'"></div>' +
               '</div>' +
             '</div>' +
             '<button class="sm" data-bind="'+id+'"'+(sugg?' data-chosen="'+esc(sugg.name)+'"':' disabled')+'>Map</button>' +
           '</div>' +
         '</div>';
  });
  h += '</div>';
  return h;
}

function renderUnmapped(list){
  return renderSection('Needs mapping',
    'Click a swatch to select those layers on canvas, then choose a token.',
    list, 'u');
}
function renderUnknown(list){
  return renderSection('Unrecognised colour',
    "Doesn't match any KoinX primitive — confirm it's intentional (e.g. artwork), or map it if it should be a token.",
    list, 'x');
}
function renderHidden(list){
  return renderSection('Hidden layers',
    "These layers are hidden in Figma (or inside a hidden frame/group) — kept separate so they don't clutter the lists above. Map them now if you want to get ahead of it, or leave them for whenever they're shown again.",
    list, 'h');
}

/**
 * Debug view for layers that were silently skipped — either treated as
 * "already semantic" (with the name/collection that triggered it) or bound
 * to a variable id that couldn't be resolved to a name at all. Collapsed
 * by default; expand to read off exactly why a specific colour didn't
 * convert or get flagged.
 */
function renderDiagnostics(alreadySemanticSample, unresolvedVarSample, strongBgSample){
  if(!alreadySemanticSample.length && !unresolvedVarSample.length && !(strongBgSample && strongBgSample.length)) return '';
  var h = '<details class="sec"><summary style="cursor:pointer;font-weight:600;font-size:12px;">Diagnostics (why a colour was skipped)</summary>';
  if(alreadySemanticSample.length){
    h += '<p style="margin:8px 0 4px;font-size:11px;color:var(--ink2);">Treated as "already semantic" — bound name/collection matched the skip check:</p>';
    h += '<div style="font-family:var(--mono);font-size:10px;line-height:1.6;">';
    alreadySemanticSample.forEach(function(s){
      h += esc(s.layer) + ' — ' + esc(s.prop) + '·' + esc(s.type) + ' — name: <b>' + esc(s.name) + '</b> — collection: <b>' + esc(s.collection || '(none)') + '</b><br>';
    });
    h += '</div>';
  }
  if(unresolvedVarSample.length){
    h += '<p style="margin:10px 0 4px;font-size:11px;color:var(--ink2);">Bound to a variable that could not be resolved to a name at all:</p>';
    h += '<div style="font-family:var(--mono);font-size:10px;line-height:1.6;">';
    unresolvedVarSample.forEach(function(s){
      h += esc(s.layer) + ' — ' + esc(s.prop) + '·' + esc(s.type) + ' — hex: <b>' + esc(s.hex) + '</b><br>';
    });
    h += '</div>';
  }
  if(strongBgSample && strongBgSample.length){
    h += '<p style="margin:10px 0 4px;font-size:11px;color:var(--ink2);">Dark content that did NOT get forced to a light colour — exactly what the ancestor walk saw, level by level:</p>';
    h += '<div style="font-family:var(--mono);font-size:10px;line-height:1.6;">';
    strongBgSample.forEach(function(s){
      h += '<div style="margin-bottom:6px;"><b>' + esc(s.layer) + '</b> — ' + esc(s.prop) + '·' + esc(s.type) + ' — own hex: ' + esc(s.hex) + '<br>';
      s.trace.forEach(function(t){
        if(t.stopped){ h += '&nbsp;&nbsp;' + esc(t.stopped) + '<br>'; return; }
        h += '&nbsp;&nbsp;[' + t.depth + '] ' + esc(t.name) + ' (' + esc(t.type) + ') — hasFill:' + t.hasFill +
             ' paintOp:' + (t.paintOpacity===null?'-':t.paintOpacity) + ' nodeOp:' + t.nodeOpacity +
             ' hex:' + esc(t.hex||'-') + ' countedAsFill:' + t.countedAsFill +
             (t.countedAsFill ? ' strong:' + t.strong + ' <b>(stopped here)</b>' : '') + '<br>';
      });
      h += '</div>';
    });
    h += '</div>';
  }
  h += '</details>';
  return h;
}

function optionsHtml(id){
  return TOKENS.map(function(t, ti){
    return '<div class="opt" data-opt="'+id+'" data-tok="'+ti+'">' +
             swatchHtml(t.light, t.dark) +
             '<span class="lbl">'+esc(t.name)+'</span>' +
           '</div>';
  }).join('') || '<div class="empty">No semantic tokens found</div>';
}

function closeMenu(){
  if(!openMenu) return;
  var m = document.querySelector('.menu[data-menu="'+openMenu+'"]');
  if(m) m.classList.add('hide');
  var b = document.querySelector('button[data-picker-btn="'+openMenu+'"]');
  if(b) b.classList.remove('open');
  openMenu = null;
}

/** Marks which card is currently selected on canvas, so a long list stays trackable. */
var selectedCard = null;
function markSelected(cardEl){
  if(selectedCard) selectedCard.classList.remove('selected');
  selectedCard = cardEl || null;
  if(selectedCard) selectedCard.classList.add('selected');
}

function wirePicker(i, onChoose){
  var btn = document.querySelector('button[data-picker-btn="'+i+'"]');
  var menu = document.querySelector('.menu[data-menu="'+i+'"]');
  var opts = document.querySelector('.opts[data-opts="'+i+'"]');
  var search = document.querySelector('input[data-search="'+i+'"]');
  opts.innerHTML = optionsHtml(i);

  btn.onclick = function(e){
    e.stopPropagation();
    var was = menu.classList.contains('hide');
    closeMenu();
    if(was){
      menu.classList.remove('hide');
      btn.classList.add('open');
      // The plugin panel is a fixed-size window, not a scrollable page — a
      // menu that opens downward near the bottom of the panel gets clipped
      // by the window edge with no way to scroll to it. Flip it above the
      // button instead whenever there isn't enough room below.
      var r = btn.getBoundingClientRect();
      var spaceBelow = window.innerHeight - r.bottom;
      var needed = Math.min(220, menu.scrollHeight || 220);
      menu.classList.toggle('up', spaceBelow < needed && r.top > spaceBelow);
      openMenu = i; search.value=''; filterOpts(); search.focus();
    }
  };
  function filterOpts(){
    var q = search.value.trim().toLowerCase();
    var rows = opts.querySelectorAll('.opt');
    rows.forEach(function(r){
      var name = TOKENS[+r.getAttribute('data-tok')].name.toLowerCase();
      r.style.display = (!q || name.indexOf(q) > -1) ? 'flex' : 'none';
    });
  }
  search.oninput = filterOpts;
  search.onclick = function(e){ e.stopPropagation(); };
  opts.querySelectorAll('.opt').forEach(function(row){
    row.onclick = function(e){
      e.stopPropagation();
      var tok = TOKENS[+row.getAttribute('data-tok')];
      btn.innerHTML = swatchHtml(tok.light, tok.dark) +
                      '<span class="lbl">'+esc(tok.name)+'</span><span class="car">▾</span>';
      btn.setAttribute('data-value', tok.name);
      closeMenu();
      onChoose(tok.name);
    };
  });
}

document.addEventListener('click', closeMenu);

function wire(list, kind){
  list.forEach(function(u, i){
    var id = kind+i;
    var sw = document.querySelector('.sw[data-i="'+id+'"]');
    var sel = document.querySelector('button[data-sel="'+id+'"]');
    var bind = document.querySelector('button[data-bind="'+id+'"]');
    var pbtn = document.querySelector('button[data-picker-btn="'+id+'"]');
    var card = $("card-"+id);
    function highlight(){ send({type:"highlight", ids:u.ids}); markSelected(card); }
    if(sw) sw.onclick = highlight;
    if(sel) sel.onclick = highlight;

    wirePicker(id, function(tokenName){
      bind.disabled = false;
      bind.setAttribute('data-chosen', tokenName);
    });

    bind.onclick = function(){
      var tokenName = bind.getAttribute('data-chosen');
      if(!tokenName){ pbtn.click(); return; }
      send({type:"bind", sig:u.sig, token:tokenName, ids:u.ids});
      var c = $("card-"+id); if(c) c.classList.add("done");
      bind.textContent = "Mapped"; bind.disabled = true;
    };
  });
}

/**
 * Layers with mixed fills where at least one character-range segment
 * couldn't be resolved to a token at all — main.js's resolveMixedTextFill()
 * already handles the case where every segment DOES resolve (each gets its
 * own correct token, even when segments differ), so what's left here is
 * genuinely unresolvable, not just "more than one colour". No single
 * colour to offer a token picker for, so this just lists them with a
 * "Select" button to find and fix by hand in Figma.
 */
function renderMixedFills(list, kind, title, hint){
  if(!list.length) return '';
  kind = kind || 'mx';
  var h = '<div class="sec"><h2>'+esc(title || 'Mixed-fill layers')+'</h2>' +
          '<p>'+(hint || 'Multiple colours on this layer, and at least one of them isn\'t a recognised KoinX colour — each colour segment resolves independently, so any resolvable segments here are already fixed. What\'s left needs a human look. Click Select to find and fix it in Figma.')+'</p>';
  list.forEach(function(u, i){
    h += '<div class="card" id="card-'+kind+i+'">' +
           '<div class="ch">' +
             '<div class="meta">' +
               '<div class="t">'+esc(u.layer)+(u.partial ? ' <span class="s">(partially fixed)</span>' : '')+'</div>' +
               '<div class="s">'+esc(u.prop)+' · '+esc(u.type)+'</div>' +
             '</div>' +
             '<button class="sm" data-mixed-sel="'+kind+i+'">Select</button>' +
           '</div>' +
         '</div>';
  });
  h += '</div>';
  return h;
}
function wireMixedFills(list, kind){
  kind = kind || 'mx';
  list.forEach(function(u, i){
    var sel = document.querySelector('button[data-mixed-sel="'+kind+i+'"]');
    var card = $("card-"+kind+i);
    if(sel) sel.onclick = function(){ send({type:"highlight", ids:[u.id]}); markSelected(card); };
  });
}

onmessage = function(e){
  var m = e.data.pluginMessage; if(!m) return;

  if(m.type === "selection"){
    $("go").disabled = m.count === 0;
    $("go").textContent = "Apply to selection";
    $("hint").textContent = m.count === 0 ? "Select a frame"
      : m.count + " frame" + (m.count>1?"s":"") + " selected";
    fitWindow();
    return;
  }
  if(m.type === "error"){
    $("err").textContent = m.message; $("err").classList.add("show");
    $("go").disabled = false; $("go").textContent = "Apply to selection";
    fitWindow();
    return;
  }
  $("err").classList.remove("show");

  if(m.type === "done"){
    TOKENS = m.tokens || [];
    $("go").disabled = false; $("go").textContent = "Apply to selection";
    var converted = m.applied + (m.structural||0) + (m.removed||0) + (m.mixedResolved||0);
    var h = '<div class="big"><b>'+converted+'</b><span>layers converted</span></div>';
    if(m.structural) h += '<div class="row"><span>Structural rule (table/label)</span><b>'+m.structural+'</b></div>';
    if(m.removed) h += '<div class="row"><span>Fill/stroke removed</span><b>'+m.removed+'</b></div>';
    if(m.mixedResolved) h += '<div class="row"><span>Mixed-fill (auto-resolved)</span><b>'+m.mixedResolved+'</b></div>';
    h += '<div class="row"><span>Already semantic</span><b>'+m.alreadySemantic+'</b></div>';
    if(m.preserved) h += '<div class="row"><span>Preserved (kept as-is)</span><b>'+m.preserved+'</b></div>';
    if(m.mixedFills && m.mixedFills.length) h += '<div class="row"><span>Mixed-fill layers (need review)</span><b>'+m.mixedFills.length+'</b></div>';
    var hiddenCount = (m.hidden || []).length + (m.hiddenMixedFills || []).length;
    if(hiddenCount) h += '<div class="row"><span>Hidden layers (skipped from lists above)</span><b>'+hiddenCount+'</b></div>';
    h += renderUnmapped(m.unmapped || []);
    h += renderUnknown(m.unknown || []);
    h += renderMixedFills(m.mixedFills || []);
    h += renderHidden(m.hidden || []);
    h += renderMixedFills(m.hiddenMixedFills || [], 'hmx', 'Hidden layers (mixed fill)',
      'Same as Mixed-fill layers above, but hidden in Figma right now — kept separate for the same reason.');
    h += renderDiagnostics(m.alreadySemanticSample || [], m.unresolvedVarSample || [], m.strongBgSample || []);
    $("out").innerHTML = h; $("out").classList.add("show");
    wire(m.unmapped || [], 'u');
    wire(m.unknown || [], 'x');
    wireMixedFills(m.mixedFills || []);
    wire(m.hidden || [], 'h');
    wireMixedFills(m.hiddenMixedFills || [], 'hmx');
    fitWindow();
    return;
  }
};
</script>
</body>
</html>
